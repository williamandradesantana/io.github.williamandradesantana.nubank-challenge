server:
  port: 8080

spring:
  application:
    name: nubank-challenge

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  output:
    ansi:
      enabled: ${OUTPUT_ANSI_ENABLED}

  main:
    banner-mode: OFF
